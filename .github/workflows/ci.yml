name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # CI=true makes Playwright build and serve the production bundle.
      - run: npx playwright test
        env:
          CI: "true"
          # Exact values the privacy test checks for (phone, postal code).
          # Kept as a secret: writing them in the repo would publish them.
          PRIVATE_STRINGS: ${{ secrets.PRIVATE_STRINGS }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
